apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-monitoring-sa
  namespace: ai-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-reader-role
  namespace: ai-monitoring
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-monitoring-role-binding
  namespace: ai-monitoring
subjects:
  - kind: ServiceAccount
    name: ai-monitoring-sa
    namespace: ai-monitoring
roleRef:
  kind: Role
  name: metrics-reader-role
  apiGroup: rbac.authorization.k8s.io
