apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-monitoring
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  PORT: "8000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-config
  namespace: ai-monitoring
data:
  SERVICE_NAME: "ai-anomaly-detector"
  PORT: "8001"
  PROMETHEUS_URL: "http://prometheus.monitoring.svc.cluster.local:9090"
  CONTAMINATION_FACTOR: "0.05"
  Z_SCORE_THRESHOLD: "3.0"
  LOG_LEVEL: "INFO"
