# Helm values for prometheus-community/kube-prometheus-stack
# Scopes Prometheus to discover ServiceMonitor/PodMonitor/PrometheusRule objects
# across ALL namespaces (not just the release namespace), so the ai-monitoring
# namespace resources in monitoring/prometheus/servicemonitors.yaml and
# monitoring/prometheus/prometheus-rules.yaml get picked up automatically.

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # Minikube-friendly resource footprint
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

grafana:
  adminPassword: null # leave unset -> chart auto-generates a random admin-password secret
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
